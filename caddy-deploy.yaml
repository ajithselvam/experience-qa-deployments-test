



apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-deployment
  namespace: ajith
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      containers:
        - name: caddy
          image: caddy:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: caddy-service
  namespace: ajith
  annotations:
    networking.gke.io/load-balancer-type: "Internal" 
spec:
  type: LoadBalancer
  loadBalancerIP: 
  selector:
    app: caddy
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
